---
# ===== Prometheus ConfigMap =====
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: studybridge
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'study-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['study-service:8081']

      - job_name: 'apply-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['apply-service:8082']

      - job_name: 'comment-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['comment-service:8083']

      - job_name: 'client-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['client-service:8084']

      - job_name: 'notification-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['notification-service:8085']

      - job_name: 'gateway-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['gateway-service:8080']

---
# ===== Prometheus Deployment =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: studybridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=7d"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config

---
# ===== Prometheus Service =====
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: studybridge
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090

---
# ===== Loki ConfigMap =====
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: studybridge
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      path_prefix: /tmp/loki
      storage:
        filesystem:
          chunks_directory: /tmp/loki/chunks
          rules_directory: /tmp/loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2020-10-24
          store: tsdb
          object_store: filesystem
          schema: v12
          index:
            prefix: index_
            period: 24h

    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h

---
# ===== Loki Deployment =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: studybridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.9.0
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki
      volumes:
        - name: loki-config
          configMap:
            name: loki-config

---
# ===== Loki Service =====
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: studybridge
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100

---
# ===== Promtail RBAC =====
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: studybridge

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "watch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: studybridge
roleRef:
  kind: ClusterRole
  name: promtail
  apiGroup: rbac.authorization.k8s.io

---
# ===== Promtail ConfigMap =====
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: studybridge
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: studybridge-pods
        static_configs:
          - targets:
              - localhost
            labels:
              namespace: studybridge
              __path__: /var/log/pods/studybridge_*/*/*.log
        pipeline_stages:
          - cri: {}
          - regex:
              expression: '/var/log/pods/[^_]+_(?P<app>[^-_][^_]*)[-_][^_]+_[^/]+/[^/]+/.*'
              source: filename
          - labels:
              app:

---
# ===== Promtail DaemonSet =====
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: studybridge
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:2.9.0
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/promtail/promtail.yaml
          ports:
            - containerPort: 9080
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      tolerations:
        - effect: NoSchedule
          operator: Exists
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers

---
# ===== Grafana Datasources (Prometheus + Loki) =====
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: studybridge
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus:9090
        isDefault: true
        access: proxy
      - name: Loki
        type: loki
        url: http://loki:3100
        access: proxy

---
# ===== Grafana Deployment =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: studybridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin123
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources

---
# ===== Grafana Service =====
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: studybridge
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
