apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: studybridge-gateway
  namespace: studybridge
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - studybridge.local
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: studybridge-virtualservice
  namespace: studybridge
spec:
  hosts:
    - studybridge.local
  gateways:
    - studybridge-gateway
  http:
    - match:
        - uri:
            prefix: /api
        - uri:
            prefix: /client
        - uri:
            prefix: /notifications
      route:
        - destination:
            host: gateway-service
            port:
              number: 8080
    - route:
        - destination:
            host: frontend
            port:
              number: 80
